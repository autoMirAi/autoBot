[project]
name = "autobot"
version = "0.1.0"
description = "A guarded QQ-to-Codex bot using NoneBot2 and OneBot 11"
requires-python = ">=3.11"
dependencies = [
  "nonebot2[fastapi]>=2.4,<3",
  "nonebot-adapter-onebot>=2.4,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[tool.nonebot]
plugin_dirs = ["autobot/plugins"]

[tool.setuptools.packages.find]
include = ["autobot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
